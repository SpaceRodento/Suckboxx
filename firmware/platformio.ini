; Suckboxx firmware
; ESP32-WROOM-32 (ESP32-D0WD-V3, varmistettu esptoolilla 18.8.2026, ks. SUUNNITTELU.md)
; Arkkitehtuuri ja rajapintasopimus: docs/firmware.md
;
;   pio run -e esp32dev -t upload     # laitteelle (simulaattorilähde)
;   pio run -e esp32dev_adc           # sama ADC1-lähteellä (protolevy GPIO34/35/32, ei kiskoa)
;   pio run -e esp32dev_hx            # sama HX710B-penkkitestilähteellä
;   pio test -e native                # puhdas logiikka (src/core) PC:llä
;
; Ilman PlatformIO:ta samat native-testit: tools/run_native_tests.sh

[platformio]
default_envs = esp32dev

[env:esp32dev]
; espressif32 6.9.0 = Arduino-ESP32 2.0.17 (GCC 8.4). Versio lukittu, koska
; 3.x-ydin muuttaa ajastin- ja ADC-rajapintoja.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; async_tcp (web-käsittelijät) ytimelle 0; ydin 1 kuuluu näytteenotolle (§4.9)
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; SSE: asiakaskohtainen jono enintään 8 viestiä (~0,5 s @ 15 Hz) oletuksen 32
    ; (~2 s) sijaan, jotta hidas puhelin saa tuoretta dataa eikä vanhaa jonoa.
    ; Ei alle 8:aa: uusi viesti lähtee heti vain, kun jonossa on alle neljännes
    ; tästä (AsyncEventSource.cpp:239). Tarkistetaan hal/web.cpp:ssä.
    -DSSE_MAX_QUEUED_MESSAGES=8
    ; Arduino-ytimen ja kirjastojen log_e pois. log_printfv odottaa UARTia
    ; aktiivisesti (esp32-hal-uart.c:842 ets_printf, :855 odotus), ~8 ms riviltä
    ; 115200 baudilla, ja AsyncEventSource kirjaa jokaisen hylätyn viestin
    ; asiakaskohtaisesti (AsyncEventSource.cpp:221). Hidas asiakas söisi silloin
    ; ydintä 0 sbx_push-taskin prioriteetilla. Liiman oma loki kulkee Serialin kautta.
    -DCORE_DEBUG_LEVEL=0
; Varoitukset vain projektin omille lähteille (src/), ei kirjastoille: liima
; pysyy yhtä puhtaana kuin core (tools/check_core_gcc84.sh).
build_src_flags = -Wall -Wextra -Wshadow
lib_deps =
    esp32async/AsyncTCP@3.3.2
    esp32async/ESPAsyncWebServer@3.6.0
test_ignore = *

; Näytelähde (WP-7a, väliaikainen; 7b lukee Config::source:n NVS:stä).
; SBX_SAMPLE_SOURCE = SourceKind (src/core/types.h): 0 = simulaattori (oletus,
; src/main.cpp), 1 = ADC, 2 = HX710B.
[env:esp32dev_adc]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSBX_SAMPLE_SOURCE=1

[env:esp32dev_hx]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSBX_SAMPLE_SOURCE=2

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Isrc
    -Itest/support
    -DSUCKBOXX_NATIVE_TEST
