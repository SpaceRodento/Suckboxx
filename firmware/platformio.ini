; Suckboxx firmware
; ESP32-WROOM-32 (ESP32-D0WD-V3, varmistettu esptoolilla 18.8.2026, ks. SUUNNITTELU.md)
; Arkkitehtuuri ja rajapintasopimus: docs/firmware.md
;
;   pio run -e esp32dev -t upload     # laitteelle
;   pio test -e native                # puhdas logiikka (src/core) PC:llä
;
; Ilman PlatformIO:ta samat native-testit: tools/run_native_tests.sh

[platformio]
default_envs = esp32dev

[env:esp32dev]
; espressif32 6.9.0 = Arduino-ESP32 2.0.17 (GCC 8.4). Versio lukittu, koska
; 3.x-ydin muuttaa ajastin- ja ADC-rajapintoja.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    esp32async/AsyncTCP@3.3.2
    esp32async/ESPAsyncWebServer@3.6.0
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Isrc
    -Itest/support
    -DSUCKBOXX_NATIVE_TEST
