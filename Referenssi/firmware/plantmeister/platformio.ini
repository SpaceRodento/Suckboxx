; PlatformIO Project Configuration File
;
; PlantMeister - Autonomous Plant Station Firmware
;
; HARDWARE (V1):
;   xiao_esp32s3  = XIAO ESP32S3 Plus + Wio-SX1262 (USE_XIAO_SX1262=true, XIAO Plus pinprofile)
;
; Legacy ESP32 WROOM (esp32dev) envit poistettu 2026-05-25 — V1-rauta on XIAO.
; CI ajaa xiao_esp32s3 + xiao_esp32s3_v2 + xiao_esp32s3_ebbflow + native
; (.github/workflows/firmware-ci.yml).

[platformio]
src_dir = .
; TUOTANTOLAITE ON PCB v2 → paljas `pio run` rakentaa oikean envin. V1-envin
; flashaus tuotantolaitteeseen sammuttaa MCP23017-napin/valon ja PE-anturit
; HILJAA (osunut kolmesti, viimeksi 16.7.2026). CI ei nojaa tahan oletukseen
; (buildaa envit eksplisiittisesti -e:lla), eika WSL-natiivitesti (-e native).
default_envs = xiao_esp32s3_v2
build_dir = C:/pio/build/plantmeister

; ── XIAO ESP32S3 Plus + Wio-SX1262 ───────────────────────────────
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
extra_scripts =
    pre:scripts/set_temp_env.py
    ; git-SHA + env-nimi build-flageiksi (FW_GIT_SHA/FW_PIO_ENV) → /api/status
    ; fw_git/fw_env + pm.py version. Jaettu e-inkin kanssa, ks. skriptin header.
    pre:../../scripts/pio_git_version.py
    ; USB-portti VID:PID:sta, ei kovakoodattuna numerona (custom_usb_role alla).
    pre:../../scripts/pio_serial_port.py
; Paayksikko = XIAO ESP32-S3 natiivi-USB. AIEMPI `upload_port = COM4` osoitti
; 26.7.2026 mitattuna E-INKIIN (CH340) — `pio run -t upload` olisi flashannut
; paayksikon firmwaren vaaraan laitteeseen. COM-numero vaihtuu koneittain ja
; kytkennassa; VID:PID ei. Yliaja tarvittaessa: `--upload-port COMx`.
custom_usb_role = main
monitor_speed = 115200
monitor_filters =
    default
    time
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_src_filter = +<*> -<lorameister/> -<test/>
build_flags =
    -DUSE_XIAO_SX1262=true
    -DUSE_XIAO_PLUS_PINS=true
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; XIAO ESP32S3: USB-CDC TX+RX (sarjakomennot kayttajalta toimii)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Laite kastelee fyysisesti NFT:lla (Platinium NFT Nutri+ 110x60), ei
    ; ebb&flow-tulvituksella -> tuotanto-oletus POIS 20.7.2026 alkaen. Ebb&flow-
    ; tilakone (scheduler, komennot, API-kentat) sailyy koodissa taysin ehjana
    ; taman flagin takana; testisykli-env alla ylikirjoittaa taman takaisin true:ksi.
    -DENABLE_EBB_FLOW=false
lib_deps =
    waspinator/AccelStepper@^1.64
    madhephaestus/ESP32Servo@^3.0.6
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/adafruit/Adafruit_VL53L0X
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit INA219@^1.2.3
    sensirion/Sensirion I2C SCD4x@^1.0.0
    ; AS7341 11-kanavainen spektrometri + MLX90614 IR-lehtilampo:
    ; Adafruit-kirjastot, kaytossa kun HW_AS7341 / HW_MLX90614 = true.
    ; GitHub-URL koska PIO-rekisterissa ei ole versioidatuna.
    https://github.com/adafruit/Adafruit_AS7341
    https://github.com/adafruit/Adafruit-MLX90614-Library
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    ESP32Async/ESPAsyncWebServer@^3.7.7
    ESP32Async/AsyncTCP@^3.3.2
    ; SX1262 LoRa radio driver
    jgromes/RadioLib@^6.6.0
    ; OTA firmware updates
    ayushsharma82/ElegantOTA@^3.1.7

; ── Ebb&Flow NOPEA testisykli-env ────────────────────────────────
; Perus-env (xiao_esp32s3) on 20.7.2026 alkaen ENABLE_EBB_FLOW=false (laite
; on NFT), ja tuotanto-env xiao_esp32s3_v2 perii sen. Tama env ylikirjoittaa
; flagin takaisin true:ksi + kayttaa LYHYITA sykliaikoja (flood ~3 min valein)
; jotta sykli toistuu monta kertaa parin tunnin testissa. Testin jalkeen
; flashaa takaisin TUOTANTO-ENV xiao_esp32s3_v2 (ei xiao_esp32s3 — se sammuttaa
; MCP23017-napin/valon ja PE-anturit hiljaa). Turvalogiikka (FLOAT_MIN dry-run,
; FLOAT_OVF + pump abs-max) on aina paalla.
[env:xiao_esp32s3_ebbflow]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DENABLE_EBB_FLOW=true
    -DEBB_FLOW_FLOOD_INTERVAL_MIN=3UL
    -DEBB_FLOW_FLOOD_DURATION_SEC=15UL
    -DEBB_FLOW_SOAK_DURATION_SEC=45UL
    -DEBB_FLOW_DRAIN_TIMEOUT_SEC=180UL
    -DEBB_NIGHT_FLOOD_MULTIPLIER=1U

; ── V2 PE-anturiprofiili (faasi 0 smoke) ─────────────────────────
; Aktivoi kolme plant-empowerment-anturia jotka ovat firmwaressa VALMIINA
; (driverit + testit + registry) mutta V1-oletuksessa pois paalta: SCD41
; (CO2 + ilma-T/RH), MLX90614 (lehti-IR), AS7341 (spektri -> PPFD).
; HW_BME280=0: SCD41 korvaa ilmamittauksen — capability-resolver valitsee
; automaattisesti SCD41:n (prioriteetti SCD41 > BME280 CAP_AIR_TEMP_HUMIDITYlle).
; CAP_AIR_PRESSURE on jo false, joten BME280:n poisto ei jata paine-
; kapabiliteettia orvoksi. V1-oletus (xiao_esp32s3) jaa koskemattomaksi.
; Taso-2 tyopaketti: docs/arkisto/kehitys/V2-F0-tyopaketit.md (WP-F0-1).
[env:xiao_esp32s3_v2]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DHW_SCD41=1
    -DHW_MLX90614=1
    -DHW_AS7341=1
    -DHW_BME280=0
    -DCAP_AIR_CO2=1
    -DCAP_LEAF_TEMP=1
    -DCAP_LIGHT_PAR=1
    -DCAP_LIGHT_SPECTRUM=1
    ; PCB v2 -rauta: tuuletin (D6 PWM + Q3/J12) + MCP23017-laajennin (0x20).
    ; ENABLE_FAN vie D6:n → FLOAT_MIN siirtyy MCP23017 GPA6:lle (ks. config.h).
    ; Tämä profiili = koko PCB v2:n rauta → CI kääntää fan+expander-polun.
    -DENABLE_FAN=true
    -DENABLE_MCP23017=true
    ; INA228 teho/virtamonitori (0x40) on osa PCB v2:ta → CI kääntää portable
    ; ina228.h + sensor_driver_ina228.h + wizard-reitit (power-current-cal)
    ; oikeaa targetia vasten. Turvallinen: HW_INA219/226 pysyvät false, ei
    ; 0x40-konfliktia; graceful degradation → advisory jos 0x40 puuttuu.
    -DHW_INA228=1
    -DCAP_POWER_MONITORING=1
    ; AS7341-gain 256x (oletus) saturoi kanavia täydessä ulkoauringossa —
    ; todettu parvekkeella 21.7.2026 (f5_555nm/f6_590nm juuttui 50000:een).
    ; 16x antaa reilusti marginaalia keskipäivän aurinkoon. HUOM: PPFD-
    ; kalibrointi (WIZARD: ppfd-cal) on ajettava uusiksi gain-muutoksen
    ; jälkeen — raaka-arvot skaalautuvat gainin mukana.
    -DAS7341_GAIN=AS7341_GAIN_16X

; ── V3 sensoripaketti (ei aktuaattoreita, ei laajenninta) ─────────
; PM_PROFILE=PM_PROFILE_V3 (config.h) asettaa ENABLE_MOTOR/PUMP/LIGHT_RELAY/
; AIR_PUMP/EBB_FLOW/FLOAT_SWITCH/OVERFLOW_SWITCH/RESERVOIR_LEVEL_SAFETY/
; WATER_TEMP falseksi ja HW_DS18B20/HW_FLOAT_SWITCH_MIN nollaksi. Tama env on
; portti joka todistaa ettei yksikaan aktuaattorisymboli jaa suojaamatta kun
; laite rakennetaan ilman moottoria, pumppua tai sailiota — ei anturisetin
; jaadytys. Anturikartoitus lukittu 12.8.2026 (docs/kehitys/v3-sensoripaketti.md):
; SCD41 pysyy siirtymakauden anturina (T/RH + CO2), kapasitiivinen kosteusanturi
; on kytketty D0:aan mutta sille EI VIELA ole ajuria firmwaressa (oma tehtava).
; PIN_BTN_LED_GREEN=8 (D9): status-LED paatetty 12.8.2026, suora GPIO ilman
; MCP23017:aa (V3:ssa ei laajenninta) — ks. schematic_lisaysohje.md V3.2/V3.6.
[env:xiao_esp32s3_v3]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DPM_PROFILE=PM_PROFILE_V3
    -DHW_SCD41=1
    -DHW_MLX90614=1
    -DHW_AS7341=1
    -DHW_BME280=0
    -DCAP_AIR_CO2=1
    -DCAP_LEAF_TEMP=1
    -DCAP_LIGHT_PAR=1
    -DCAP_LIGHT_SPECTRUM=1
    -DAS7341_GAIN=AS7341_GAIN_16X
    -DPIN_BTN_LED_GREEN=8

; ── Tuuletin-/expander-rautasessio (ilman PE-antureita) ──────────
; Sama fan+MCP23017-polku kuin v2:ssa, mutta V1-anturiprofiililla (BME280,
; ei SCD41/AS7341/MLX). Fokusoitu tuulettimen ja laajentimen smoke-testiin
; kun PE-antureita ei haluta samaan flashiin (hw_integrointi.md askel 5).
[env:xiao_esp32s3_fan]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DENABLE_FAN=true
    -DENABLE_MCP23017=true

; ── Native unit tests (no hardware required) ─────────────────────
[env:native]
platform = native
test_framework = unity
extra_scripts = pre:scripts/native_toolchain.py
build_flags =
    -std=gnu++17
    -Itest/stubs
    -DPLANTMEISTER_NATIVE_TEST
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
