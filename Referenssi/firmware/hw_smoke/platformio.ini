; PlantMeister — Hardware smoke tests (WiFi-pohjainen).
;
; Jokainen smoke on erillinen standalone-sketch joka harjoittaa YHTÄ
; rauta-ominaisuutta. Sketsit nousevat WiFiin, lähettävät logia
; UDP-broadcastina (yhteensopiva scripts/wireless_log_listener.py:n
; kanssa) ja vastaanottavat OTA-päivityksiä /update-osoitteessa.
;
; → Vain ensimmäinen flash USB:n yli. Sen jälkeen kaikki OTA:n kautta.
; → Lokia voi kuunnella koko ajan ilman että COM-portti varataan.
;
; Pin-allokaatio: ../shared/v1_pins.h (mirror of kytkennat.md § 1).
; Yhteinen WiFi+OTA+UDP-helper: ../shared/smoke_wifi.h.
; Secrets (WIFI_STA_*, OTA_*): ../plantmeister/secrets.h (gitignored).
;
; Käyttö:
;   pio run -e blink -t upload                 ; ensimmäinen flash USB:n yli
;   python scripts/wireless_log_listener.py    ; lokin kuuntelu
;   ; sen jälkeen: selaimella http://<XIAO-IP>/update -> uusi .bin
;
; Saatavilla:
;   - blink           — perus LED-vilkku (skippaa jos PIN_LED_STATUS=-1, vain lokia)
;   - button_led      — nappi → LED (skippaa LED-osa jos -1, lokittaa BTN-tilan)
;   - i2c_scan        — I2C-väylän laitteiden haku
;   - dht20_read      — DHT20 (0x38) lämpö+kosteus, I2C-väylän toimivuustesti
;   - mcp23017_read   — MCP23017-expanderin PORTA/B-pinnien luku (kytkintesti)
;   - light_dead_man  — nappi pohjassa → kasvilamppu-MOSFET päällä, vapaa → pois
;   - pump_dead_man   — sama mutta vesipumppu-MOSFETille
;   - motor_dead_man  — sama mutta moottorille (STEP-pulssi 1 kHz napin pohjassa)

[platformio]
src_dir = src
default_envs = light_dead_man

[common]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; USB-portti VID:PID:sta. Aiempi kovakoodattu COM4 osoitti 26.7.2026 mitattuna
; e-inkiin — dead-man-smoke olisi mennyt vaaraan laitteeseen. Yliaja: --upload-port
custom_usb_role = main
extra_scripts = pre:../../scripts/pio_serial_port.py
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_flags =
    -I../shared
    -I../plantmeister                      ; secrets.h
    -DUSE_XIAO_PLUS_PINS=true
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps =
    ESP32Async/ESPAsyncWebServer@^3.7.7
    ESP32Async/AsyncTCP@^3.3.2
    ayushsharma82/ElegantOTA@^3.1.7

[env:blink]
extends = common
build_src_filter = +<01_blink.cpp>

[env:button_led]
extends = common
build_src_filter = +<02_button_led.cpp>

[env:i2c_scan]
extends = common
build_src_filter = +<04_i2c_scan.cpp>
lib_deps =
    ${common.lib_deps}
    Wire

[env:dht20_read]
extends = common
build_src_filter = +<08_dht20_read.cpp>
lib_deps =
    ${common.lib_deps}
    Wire

[env:mcp23017_read]
extends = common
build_src_filter = +<09_mcp23017_read.cpp>
lib_deps =
    ${common.lib_deps}
    Wire

[env:light_dead_man]
extends = common
build_src_filter = +<05_light_dead_man.cpp>

[env:pump_dead_man]
extends = common
build_src_filter = +<06_pump_dead_man.cpp>

[env:motor_dead_man]
extends = common
build_src_filter = +<07_motor_dead_man.cpp>
