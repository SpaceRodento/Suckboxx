; PlatformIO Project Configuration
; E-ink Seinataulu
;   e1001  — Seeed reTerminal E1001 (XIAO ESP32-S3 + GDEY075T7)  ← ainoa rauta
;   native — natiivit Unity-testit (ei rautaa)
;
; Aiempi esp32dev-env (ESP32 DevKit V1 + Waveshare 7.5" V2) poistettu 27.7.2026:
; rauta ei ole projektissa, env ei ollut CI:ssa eika sita oltu kaannetty
; kuukausiin. Kaantamaton env on huonompi kuin ei enviä — se nayttaa tuetulta.

[platformio]
src_dir = .
default_envs = e1001

[env:base]
platform = espressif32
framework = arduino
; git-SHA + env-nimi build-flageiksi (FW_GIT_SHA/FW_PIO_ENV) → boot-loki.
; Jaettu plantmeisterin kanssa — versiodrifti pääyksikön ja e-inkin välillä
; maksoi tunnin vianetsintää 16.7.2026 (PR #209 askellaatikko ei ollut
; flashattuna, näytti feature-vialta). Ks. scripts/pio_git_version.py.
extra_scripts =
    pre:../../scripts/pio_git_version.py
    ; USB-portti VID:PID:sta (CH340) — e-inkin COM-numero ei ole vakio: se oli
    ; COM5 kesalla 2026 ja COM4 26.7.2026. Yliaja: --upload-port COMx
    pre:../../scripts/pio_serial_port.py
custom_usb_role = eink
monitor_speed = 115200
; -<test/> keeps unit tests out of the hardware image (src_dir = . would
; otherwise compile test_main.cpp files in) — same pattern as plantmeister.
; -<smoke/> does the same for the standalone hardware-probe sketches: each
; has its own setup()/loop(), so leaving them in would break the link with
; duplicate symbols. They are built only by their own env (juice_test).
build_src_filter = +<*> -<../plantmeister/> -<test/> -<smoke/>

[env:e1001]
extends = env:base
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
; reTerminal E1001 routes debug-serial through an onboard CH340 on UART0
; (GPIO43/44), so disable the native USB-CDC Serial path and use the
; hardware UART instead. Otherwise Serial.print disappears into the
; unused native USB.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    https://github.com/Seeed-Projects/Seeed_GxEPD2
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@^6.21.5

; ── Native unit tests (no hardware required) ──────────────────────
; GxEPD2/Adafruit_GFX (display_layout.h's rendering) and WiFi/HTTPClient/
; ESPmDNS (data_fetch.h's network fetch) are NOT native-testable without
; heavy stubbing, so those stay hardware-only. The pure-logic pieces were
; extracted into small hardware-independent headers specifically so they
; CAN be exercised here: display_data.h (the DisplayData snapshot),
; resolve_field.h (FieldId -> value/unit mapping), data_fetch_parse.h
; (/api/state JSON -> DisplayData). layout_def.h's EINK_CARDS/EINK_CONTEXT
; tables needed no extraction — already hardware-independent.
; EINK_NATIVE_TEST mirrors PLANTMEISTER_NATIVE_TEST (firmware/plantmeister):
; config.h uses it to skip the local (gitignored) secrets.h so native tests
; always see the same committed secrets.h.example values.

; ── Rauta-smoke: pelituntuman koe ─────────────────────────────────
; Standalone-sketsi joka mittaa nappi→ääni- ja nappi→osittaispäivitys-
; latenssin. Suunnitelma ja hyväksymiskriteerit:
; docs/kehitys/pelillistaminen-tietopohja.md § 4.5
;   pio run -e juice_test -t upload
; Ei kuulu CI:hin eikä tuotantokuvaan — oma env, oma build_src_filter.
; Pinnit ovat sketsin sisällä (ei config.h), koska nappi- ja summeripinnit
; ovat vahvistamattomia siihen asti kun tämä koe on ajettu raudalla.
[env:juice_test]
extends = env:e1001
build_src_filter = +<smoke/juice_test.cpp>

; ── Rauta-smoke: microSD-kortti ───────────────────────────────────
; Todistaa etta kortti vastaa talla raudalla ENNEN kuin M2:n sd_logger.h
; kirjoitetaan sita vasten: DET-pinni, EN-pinnin polariteetti, mount,
; pitka tiedostonimi, kirjoitus+takaisinluku — ja sama uudelleen sen
; jalkeen kun e-paperi on ajanut samaa SCK/MOSI-vaylaa.
;   pio run -e sd_test -t upload
; Ei kuulu CI:hin eika tuotantokuvaan. SD/FS tulevat Arduino-frameworkista,
; joten lib_deps periytyy e1001:sta sellaisenaan.
[env:sd_test]
extends = env:e1001
build_src_filter = +<smoke/sd_test.cpp>

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DEINK_NATIVE_TEST
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
